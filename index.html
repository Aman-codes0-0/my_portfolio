<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman - Portfolio Entry</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 800px;
            margin-top: 3rem;
        }

        .selection-card {
            padding: 3rem 2rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .selection-card:hover {
            transform: translateY(-10px);
        }

        .selection-icon {
            font-size: 4rem;
        }

        .selection-title {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .selection-desc {
            font-family: 'Caveat', cursive;
            font-size: 1.3rem;
        }
    </style>
</head>

<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-window brutalist-box box-shadow-main">
            <div class="loader-header">
                <span class="loader-title handwritten">System Boot...</span>
                <div class="window-controls">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-beige"></span>
                    <span class="dot dot-teal"></span>
                </div>
            </div>
            <div class="loader-body">
                <div class="progress-container brutalist-box">
                    <div class="progress-bar">
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="desk-background">
        <div class="landing-container">
            <h1 class="brutalist-box highlight-yellow box-shadow-main" style="padding: 1rem 2rem; font-size: clamp(1.5rem, 5vw, 2.5rem);">
                CHOOSE INTERFACE
            </h1>
            
            <div class="selection-grid">
                <!-- GUI Option -->
                <a href="home.html" class="selection-card brutalist-box box-shadow-main btn-blue">
                    <div class="selection-icon">🖥️</div>
                    <div class="selection-title">GRAPHICAL (GUI)</div>
                    <p class="selection-desc">Experience the visual portfolio</p>
                </a>

                <!-- Terminal Option -->
                <a href="terminal.html" class="selection-card brutalist-box box-shadow-main highlight-green">
                    <div class="selection-icon">⌨️</div>
                    <div class="selection-title">TERMINAL (CLI)</div>
                    <p class="selection-desc">Access via command line</p>
                </a>
            </div>

            <p class="handwritten pt-4" style="font-size: 1.5rem; opacity: 0.7;">Welcome, Aman's System v1.0...</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
