<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman - My Journey</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-window brutalist-box box-shadow-main">
            <div class="loader-header">
                <span class="loader-title handwritten">Loading...</span>
                <div class="window-controls">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-beige"></span>
                    <span class="dot dot-teal"></span>
                </div>
            </div>
            <div class="loader-body">
                <div class="progress-container brutalist-box">
                    <div class="progress-bar">
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Appears like a piece of paper on a desk -->
    <div class="desk-background">
        <div class="page-wrapper">
            <!-- Header -->
            <header class="site-header brutalist-box highlight-yellow">
                <a href="home.html" class="logo box-shadow-main action-btn btn-blue"
                    style="text-decoration: none; color: inherit;">A </a>
                <nav class="main-nav">
                    <a href="home.html#home">Home</a>
                    <a href="home.html#about">About</a>
                    <a href="projects.html">Projects</a>
                    <a href="journey.html">Journey</a>
                    <a href="home.html#skills">Skills</a>
                    <a href="contact.html">Contact</a>
                </nav>
                <div class="header-actions">
                    <button class="btn btn-icon btn-blue switch-theme box-shadow-main">☾</button>
                </div>
            </header>

            <!-- Journey Section -->
            <section id="journey-page" class="journey-page-section">
                <div class="section-title brutalist-box highlight-yellow box-shadow-main">MY JOURNEY</div>

                <div class="journey-container brutalist-box box-shadow-main" style="margin-top: 2rem; display: block;">
                    <!-- Timeline -->
                    <div class="timeline">
                        <div class="timeline-header border-bottom">
                            <h4>Achievements</h4>
                        </div>
                        <div class="timeline-items">

                            <div class="timeline-item">
                                <span class="badge brutalist-box highlight-blue">2025</span>
                                <h4>Smart India Hackathon (SIH)</h4>
                                <p>National-level Finalist in India's biggest hackathon.</p>
                                <button onclick="openCertModal('source/SIH.jpg')" class="btn box-shadow-small" style="padding: 0.2rem 0.5rem; font-size: 0.9rem; margin-top: 0.5rem; display: inline-block; background-color: var(--bg-color); color: var(--text-color); cursor: pointer;">📄 View Certificate</button>
                            </div>
                            <div class="timeline-item">
                                <span class="badge brutalist-box highlight-pink">2025</span>
                                <h4>Aviothic 2.0</h4>
                                <p>Secured a Top 10 Rank in the college-level hackathon.</p>
                                <button onclick="openCertModal('source/Aviothic2.0.jpg')" class="btn box-shadow-small" style="padding: 0.2rem 0.5rem; font-size: 0.9rem; margin-top: 0.5rem; display: inline-block; background-color: var(--bg-color); color: var(--text-color); cursor: pointer;">📄 View Certificate</button>
                            </div>

                        </div>
                    </div>


                </div>
            </section>
        </div>
    </div>

    <!-- Certificate Modal -->
    <div id="certModal" class="cert-modal" onclick="closeCertModal()">
        <div class="cert-modal-content brutalist-box box-shadow-main" onclick="event.stopPropagation()">
            <div class="cert-modal-header border-bottom">
                <h4>Certificate Preview</h4>
                <button class="btn highlight-pink box-shadow-small" onclick="closeCertModal()">X</button>
            </div>
            <div class="cert-modal-body">
                <img id="certImage" src="" alt="Certificate Preview">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
