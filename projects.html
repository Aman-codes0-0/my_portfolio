<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman - Projects</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-window brutalist-box box-shadow-main">
            <div class="loader-header">
                <span class="loader-title handwritten">Loading...</span>
                <div class="window-controls">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-beige"></span>
                    <span class="dot dot-teal"></span>
                </div>
            </div>
            <div class="loader-body">
                <div class="progress-container brutalist-box">
                    <div class="progress-bar">
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                        <div class="progress-segment"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Appears like a piece of paper on a desk -->
    <div class="desk-background">
        <div class="page-wrapper">
            <!-- Header -->
            <header class="site-header brutalist-box highlight-yellow">
                <a href="home.html" class="logo box-shadow-main action-btn btn-blue"
                    style="text-decoration: none; color: inherit;">A </a>
                <nav class="main-nav">
                    <a href="home.html#home">Home</a>
                    <a href="home.html#about">About</a>
                    <a href="projects.html">Projects</a>
                    <a href="journey.html">Journey</a>
                    <a href="home.html#skills">Skills</a>
                    <a href="contact.html">Contact</a>
                </nav>
                <div class="header-actions">
                    <button class="btn btn-icon btn-blue switch-theme box-shadow-main">☾</button>
                </div>
            </header>

            <!-- Projects Section -->
            <section id="projects-page" class="projects-page-section">
                <div class="section-title brutalist-box highlight-yellow box-shadow-main">MY PROJECTS</div>

                <div id="github-projects-container" class="projects-grid" style="margin-top: 2rem;">
                    <!-- Projects will be dynamically loaded here -->
                    <div class="loading-state text-center" style="grid-column: 1 / -1; padding: 4rem;">
                        <h3 class="handwritten">Fetching repositories from GitHub...</h3>
                        <div class="progress-bar brutalist-box" style="max-width: 300px; margin: 1rem auto;">
                            <div class="progress-segment" style="width: 100%; animation: pulse 1.5s infinite;"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
